name: Generate catalog thumbnails

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-thumbnails-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: github.actor != 'github-actions[bot]'
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.actor != 'github-actions[bot]'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        if: github.actor != 'github-actions[bot]'
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate and clean catalog thumbnails
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("assets/images/catalog")
          thumbnails = source / "thumbnails"
          optimized = source / "optimized"
          thumbnails.mkdir(exist_ok=True)
          optimized.mkdir(exist_ok=True)
          extensions = {".png", ".jpg", ".jpeg", ".webp", ".gif"}

          image_paths = [
              path
              for path in source.rglob("*")
              if path.is_file()
              and path.suffix.lower() in extensions
              and thumbnails not in path.parents
              and optimized not in path.parents
          ]

          for image_path in image_paths:
              relative = image_path.relative_to(source)
              thumbnail_target = thumbnails / relative.with_suffix(".webp")
              optimized_target = optimized / relative.with_suffix(".webp")
              thumbnail_target.parent.mkdir(parents=True, exist_ok=True)
              optimized_target.parent.mkdir(parents=True, exist_ok=True)

              with Image.open(image_path) as image:
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA" if "transparency" in image.info else "RGB")

                  thumbnail_image = image.copy()
                  thumbnail_image.thumbnail((640, 480), Image.Resampling.LANCZOS)
                  thumbnail_image.save(thumbnail_target, "WEBP", quality=74, method=6)

                  optimized_image = image.copy()
                  optimized_image.thumbnail((1200, 1200), Image.Resampling.LANCZOS)
                  optimized_image.save(optimized_target, "WEBP", quality=82, method=6)

          for derivative_root in (thumbnails, optimized):
              for derivative in derivative_root.rglob("*.webp"):
                  relative = derivative.relative_to(derivative_root)
                  if not any((source / relative.with_suffix(extension)).is_file() for extension in extensions):
                      derivative.unlink()
          PY

      - name: Commit generated thumbnails
        if: github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- assets/images/catalog/thumbnails assets/images/catalog/optimized; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/catalog/thumbnails assets/images/catalog/optimized
          git commit -m "Generate catalog thumbnails"
          git push
